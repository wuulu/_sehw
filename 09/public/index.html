<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽籤所 · Lucky Draw</title>
    <meta
      name="description"
      content="簡潔好用的線上抽籤網站，支援多人抽出、不重複中獎、歷史紀錄與 CSV 匯出。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0b14'/%3E%3Cpath d='M32 10l5.2 14.8L52 30l-14.8 5.2L32 50l-5.2-14.8L12 30l14.8-5.2z' fill='%23f5c66b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="orb orb-violet"></span>
      <span class="orb orb-gold"></span>
      <span class="orb orb-teal"></span>
    </div>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 3l2.2 6.1L20.5 11l-6.3 1.9L12 19l-2.2-6.1L3.5 11l6.3-1.9L12 3z" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>抽籤所</strong>
          <span>LUCKY DRAW</span>
        </span>
      </a>
      <div class="saved-badge">
        <span class="saved-dot" aria-hidden="true"></span>
        名單自動儲存在此裝置
      </div>
    </header>

    <main class="layout">
      <section class="panel pool-panel" aria-labelledby="poolTitle">
        <div class="panel-head">
          <div>
            <h2 id="poolTitle">籤筒</h2>
            <p class="panel-sub">每行一位，也可用逗號或頓號分隔</p>
          </div>
          <span class="pill" id="poolCount">0 人</span>
        </div>

        <label class="sr-only" for="namesInput">參加者名單</label>
        <textarea
          id="namesInput"
          class="names-input"
          spellcheck="false"
          placeholder="輸入參加者名字，例如：&#10;林小美&#10;陳阿宏&#10;張怡君"
        ></textarea>

        <div class="pool-actions">
          <button class="btn ghost" id="demoBtn" type="button">載入示範名單</button>
          <button class="btn ghost" id="clearNamesBtn" type="button">清空名單</button>
        </div>

        <dl class="pool-meta">
          <div>
            <dt>可抽人數</dt>
            <dd id="availableCount">0</dd>
          </div>
          <div>
            <dt>已中獎</dt>
            <dd id="wonCount">0</dd>
          </div>
          <div>
            <dt>抽出人數</dt>
            <dd id="drawCountMeta">1</dd>
          </div>
        </dl>
      </section>

      <section class="panel draw-panel" aria-labelledby="drawTitle">
        <h2 id="drawTitle" class="sr-only">抽籤區</h2>

        <div class="stage" id="stage">
          <div class="stage-ring" aria-hidden="true"></div>
          <p class="stage-label" id="stageLabel">準備好了嗎？</p>
          <div class="rolling" id="rolling" aria-live="polite">
            <span class="rolling-name" id="rollingName">?</span>
          </div>
          <div class="winner-grid" id="winnerGrid" aria-live="polite"></div>
        </div>

        <div class="controls">
          <div class="control">
            <span class="control-label">抽出人數</span>
            <div class="stepper">
              <button id="minusBtn" type="button" aria-label="減少抽出人數">−</button>
              <input
                id="drawCount"
                type="number"
                min="1"
                max="50"
                value="1"
                inputmode="numeric"
                aria-label="抽出人數"
              />
              <button id="plusBtn" type="button" aria-label="增加抽出人數">＋</button>
            </div>
          </div>

          <label class="switch">
            <input type="checkbox" id="allowRepeat" />
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
            <span class="switch-text">
              <strong>允許重複中獎</strong>
              <small>關閉時，抽過的人不會再被抽到</small>
            </span>
          </label>

          <button class="btn primary" id="drawBtn" type="button">
            <span id="drawBtnText">開始抽籤</span>
            <kbd>Ctrl</kbd><kbd>↵</kbd>
          </button>
        </div>

        <p class="notice" id="notice" role="status"></p>
      </section>
    </main>

    <section class="panel history-panel" aria-labelledby="historyTitle">
      <div class="panel-head">
        <div>
          <h2 id="historyTitle">抽籤紀錄</h2>
          <p class="panel-sub">最近 50 次結果，保存在瀏覽器中</p>
        </div>
        <div class="history-actions">
          <button class="btn small ghost" id="undoBtn" type="button">撤回上次</button>
          <button class="btn small ghost" id="exportBtn" type="button">匯出 CSV</button>
          <button class="btn small danger" id="clearHistoryBtn" type="button">清除紀錄</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

    <footer class="footer">
      <p>使用 <code>crypto.getRandomValues</code> 抽出，結果僅供娛樂與活動使用。</p>
      <p>資料只存在你的瀏覽器，不會上傳到伺服器。</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
